[package]
name = "narratics-desktop"
version = "0.1.0"
edition = "2021"
description = "Narratics Native Desktop Application (macOS, Windows, Linux)"
license = "MIT OR Apache-2.0"

[dependencies]
narratics-engine-core = { path = "../../crates/engine-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
