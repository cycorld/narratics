name: "🐛 Bug Report"
description: "File an issue for a bug or unexpected behavior in Narratics"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug in Narratics! Please ensure you have tested against the latest version.
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: "Which part of Narratics is affected?"
      options:
        - "Studio UI / Web"
        - "Desktop App (Tauri)"
        - "Engine Core (CRDT / Storage)"
        - "Sync / Backend Server"
        - "Typst Export / Rendering"
        - "Mobile Bridge"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: "Narratics Version & Environment"
      description: "App version, OS (macOS, Linux, Windows), and browser if web."
      placeholder: "Narratics v0.1.0, macOS Sonoma 14.5 / Ubuntu 24.04"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: "Describe the bug"
      description: "A clear and concise description of what happened."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps to trigger the bug."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: "Privacy & Secret Check"
      options:
        - label: "I confirm that no private secrets, tokens, manuscript content, or personal data are included in this report."
          required: true
